<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SuperChat AI</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d0f17">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    body {
      background-color: #0d0f17;
      color: #e2e8f0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .glass {
      background: rgba(23, 27, 44, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glow-purple {
      box-shadow: 0 0 25px rgba(147, 51, 234, 0.25);
    }
    .chat-scroll::-webkit-scrollbar {
      width: 6px;
    }
    .chat-scroll::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
    }
  </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

  <!-- Header -->
  <header class="glass border-b border-gray-800 px-6 py-4 flex items-center justify-between z-10">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-xl overflow-hidden flex items-center justify-center glow-purple">
        <img src="icon.svg" alt="SuperChat Icon" class="w-full h-full object-cover"/>
      </div>
      <div>
        <h1 class="font-bold text-lg tracking-wide text-white">SuperChat <span class="text-xs font-normal text-purple-400 border border-purple-500/30 px-2 py-0.5 rounded-full ml-1">PRO</span></h1>
        <p class="text-xs text-gray-400" id="status-text">Engine Ready • Standalone AI</p>
      </div>
    </div>
    <div class="flex items-center space-x-3">
      <button onclick="clearChat()" class="text-gray-400 hover:text-white p-2 rounded-lg hover:bg-gray-800/50 transition">
        <i class="fa-solid fa-trash-can"></i>
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 flex overflow-hidden">
    
    <!-- Sidebar / Model Settings -->
    <aside class="w-80 glass border-r border-gray-800 p-5 hidden md:flex flex-col justify-between">
      <div class="space-y-6">
        <div>
          <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">AI Engine Brain</h2>
          <label class="block text-xs text-gray-300 mb-1">Select Local Model</label>
          <select id="model-select" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-purple-500">
            <option value="Llama-3.2-1B-Instruct-q4f16_1-MLC">Llama 3.2 (1B - Fast)</option>
            <option value="gemma-2-2b-it-q4f16_1-MLC">Gemma 2 (2B - Smart)</option>
            <option value="Qwen2.5-0.5B-Instruct-q4f16_1-MLC">Qwen 2.5 (0.5B - Ultra Lite)</option>
          </select>
        </div>

        <div>
          <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">System Persona</h2>
          <textarea id="system-prompt" rows="4" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-purple-500" placeholder="Define SuperChat's personality...">You are SuperChat, a friendly, intelligent, and highly capable AI assistant.</textarea>
        </div>
      </div>

      <div class="p-3 rounded-lg bg-purple-950/30 border border-purple-800/30 text-xs text-purple-300">
        <i class="fa-solid fa-shield-halved mr-1"></i> Running 100% locally in your browser. No data leaves your machine.
      </div>
    </aside>

    <!-- Chat Area -->
    <section class="flex-1 flex flex-col justify-between bg-gray-950/50">
      
      <!-- Messages Box -->
      <div id="chat-box" class="flex-1 overflow-y-auto p-6 space-y-4 chat-scroll">
        <div class="flex items-start space-x-3">
          <div class="w-8 h-8 rounded-lg bg-purple-600 flex items-center justify-center text-xs font-bold shrink-0">AI</div>
          <div class="glass p-4 rounded-2xl rounded-tl-none max-w-2xl text-sm leading-relaxed border border-gray-800">
            Welcome to <strong>SuperChat</strong>! I am your custom-built AI. Type a message below to start chatting.
          </div>
        </div>
      </div>

      <!-- Input Area -->
      <div class="p-4 glass border-t border-gray-800">
        <div class="max-w-4xl mx-auto relative flex items-center">
          <textarea id="user-input" rows="1" placeholder="Ask SuperChat anything..." class="w-full bg-gray-900/80 border border-gray-700 rounded-xl py-3.5 pl-4 pr-12 text-sm text-white focus:outline-none focus:border-purple-500 resize-none"></textarea>
          <button onclick="sendMessage()" class="absolute right-2 p-2 bg-gradient-to-r from-purple-600 to-cyan-500 hover:opacity-90 text-white rounded-lg transition duration-200">
            <i class="fa-solid fa-paper-plane"></i>
          </button>
        </div>
      </div>
    </section>
  </main>

  <!-- WebLLM Engine SDK (ES Module) -->
  <script type="module">
    import * as webllm from "https://esm.run/@mlc-ai/web-llm";

    let engine;
    const messages = [];

    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('user-input');
    const statusText = document.getElementById('status-text');
    const modelSelect = document.getElementById('model-select');
    const systemPrompt = document.getElementById('system-prompt');

    async function initEngine() {
      const selectedModel = modelSelect.value;
      statusText.innerText = "Loading AI Brain into memory...";

      try {
        engine = await webllm.CreateMLCEngine(selectedModel, {
          initProgressCallback: (report) => {
            statusText.innerText = `Loading Brain: ${Math.round(report.progress * 100)}%`;
          }
        });
        statusText.innerText = "Engine Ready • Standalone AI";
      } catch (err) {
        console.error(err);
        statusText.innerText = "Fallback API / Demo Mode";
      }
    }

    window.sendMessage = async function() {
      const text = userInput.value.trim();
      if (!text) return;

      appendMessage('user', text);
      userInput.value = '';

      messages.push({ role: "user", content: text });

      const botMsgDiv = appendMessage('assistant', 'Thinking...');

      try {
        if (engine) {
          const systemMsg = { role: "system", content: systemPrompt.value };
          const response = await engine.chat.completions.create({
            messages: [systemMsg, ...messages]
          });
          const reply = response.choices[0].message.content;
          botMsgDiv.innerHTML = reply;
          messages.push({ role: "assistant", content: reply });
        } else {
          setTimeout(() => {
            const reply = "I am SuperChat running in standalone demo mode! Enable WebGPU in your browser settings to run full local AI models.";
            botMsgDiv.innerHTML = reply;
            messages.push({ role: "assistant", content: reply });
          }, 600);
        }
      } catch (e) {
        botMsgDiv.innerHTML = "Error generating response. Make sure WebGPU is enabled in your browser.";
      }
    };

    function appendMessage(role, content) {
      const wrapper = document.createElement('div');
      wrapper.className = `flex items-start space-x-3 ${role === 'user' ? 'justify-end' : ''}`;
      
      const avatar = role === 'user' 
        ? `<div class="w-8 h-8 rounded-lg bg-cyan-600 flex items-center justify-center text-xs font-bold shrink-0 order-2 ml-3">You</div>`
        : `<div class="w-8 h-8 rounded-lg bg-purple-600 flex items-center justify-center text-xs font-bold shrink-0">AI</div>`;
      
      const bubble = document.createElement('div');
      bubble.className = `glass p-4 rounded-2xl ${role === 'user' ? 'bg-purple-900/40 border-purple-700/50 rounded-tr-none' : 'rounded-tl-none'} max-w-2xl text-sm leading-relaxed border border-gray-800`;
      bubble.innerText = content;

      wrapper.innerHTML = role === 'user' ? bubble.outerHTML + avatar : avatar + bubble.outerHTML;
      chatBox.appendChild(wrapper);
      chatBox.scrollTop = chatBox.scrollHeight;
      return wrapper.querySelector('.glass');
    }

    window.clearChat = function() {
      chatBox.innerHTML = '';
      messages.length = 0;
    };

    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    modelSelect.addEventListener('change', () => {
      initEngine();
    });

    initEngine();
  </script>
</body>
</html>
